<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>화승위키 - 리디자인 배포 준비 중</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f6fa;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#182640}
  .card{width:min(92vw,420px);background:#fff;border:1px solid #e6e9f1;border-radius:16px;padding:40px 36px;text-align:center;box-shadow:0 10px 30px rgba(24,38,64,.06)}
  .logo{width:52px;height:52px;margin:0 auto 18px;background:#1e3a66;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
  p{margin-top:10px;font-size:13.5px;line-height:1.7;color:#6b7590}
  .pill{margin-top:18px;display:inline-block;padding:6px 14px;border-radius:999px;background:#edf1f8;color:#1e3a66;font-size:12px;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="logo">화</div>
  <h1>화승위키</h1>
  <p>사내 업무 지식 플랫폼 데모의<br/>리디자인 배포를 준비하고 있습니다.<br/>잠시 후 다시 확인해 주세요.</p>
  <span class="pill">사내 아이디어 공모전 제출용 데모</span>
</div>
</body>
</html>
